<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Tesla sign-in · Charge Line</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
    background: light-dark(#efe8df, #0d1f33);
    color: light-dark(#173353, #efe8df);
    font: 400 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }
  main { max-width: 26em; text-align: center; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  a { color: light-dark(#295a92, #f1918b); }
</style>
</head>
<body>
<main>
  <h1>Tesla sign-in</h1>
  <div id="result"><p>Nothing to do here. You can close this page.</p></div>
</main>
<script>
  // Tesla returns here after sign-in. This page only reads the address bar and hands the result back to the
  // Charge Line app; it sends nothing anywhere. The app checks the state matches the sign-in it started, and
  // the code is single use and useless without the client secret, which only Charge Line's server holds.
  const params = new URLSearchParams(location.search);
  const result = document.getElementById("result");
  const paragraph = (text) => Object.assign(document.createElement("p"), { textContent: text });

  if ((params.get("state") ?? "").startsWith("app_")) {
    const back = new URL("chargeline://tesla-callback");
    for (const name of ["code", "state", "error", "error_description"]) {
      const value = params.get(name);
      if (value) back.searchParams.set(name, value);
    }
    const link = Object.assign(document.createElement("a"), { href: back.toString(), textContent: "Open Charge Line" });
    result.replaceChildren(paragraph("Returning to Charge Line…"), link);
    location.replace(back.toString());
  } else if (params.get("error")) {
    result.replaceChildren(paragraph(`Tesla returned an error: ${params.get("error")} ${params.get("error_description") ?? ""}`));
  }
</script>
</body>
</html>
